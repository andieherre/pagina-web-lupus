<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título que muestra Google en los resultados de búsqueda -->
    <title>Lupus El Salvador | Información, Síntomas y Apoyo</title>

    <!-- Descripción (snippet) que aparece debajo del enlace en Google -->
    <meta 
      name="description" 
      content="Portal informativo sobre el Lupus en El Salvador. Conoce los síntomas, diagnóstico temprano, tratamientos y recursos de apoyo para pacientes y familias." 
    />

    <!-- Orden directa para que el robot de Google indexe la página -->
    <meta name="robots" content="index, follow" />

    <!-- Clave de verificación de propiedad de Google Search Console -->
    <!-- (Reemplaza 'AQUI_TU_CODIGO_DE_VERIFICACION' con el código que te dé Google al registrar el sitio) -->
    <meta name="google-site-verification" content="AQUI_TU_CODIGO_DE_VERIFICACION" />

    <!-- Metadatos Open Graph (para vistas previas al compartir el enlace) -->
    <meta property="og:title" content="Lupus El Salvador | Información, Síntomas y Apoyo" />
    <meta property="og:description" content="Portal informativo sobre el Lupus en El Salvador: causas, síntomas y recursos para pacientes." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <!-- Contenedor y script base de React (no modificados para no alterar el código de tu equipo) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
